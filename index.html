<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plataforma de localidades da EngNet</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
    
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <!-- Ficheiro JavaScript separado -->
    <script src="script.js" defer></script>
</head>
<body class="bg-white min-h-screen flex flex-col items-center py-10 font-sans px-4">

    <!-- Cabeçalho -->
    <header class="w-full max-w-4xl border-2 border-orange-500 p-4 flex items-center mb-8">
        <div class="text-orange-500 flex-shrink-0">
            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
            </svg>
        </div>
        <h1 class="flex-grow text-center text-3xl font-bold text-orange-500">Plataforma de localidades da EngNet</h1>
    </header>

    <!-- Área de Filtros (Região, UF via Accordion e Busca) -->
    <section class="flex flex-col md:flex-row gap-6 mb-8 w-full max-w-4xl justify-center items-end">
        
        <!-- 1. Accordion de Região -->
        <div class="flex flex-col w-full md:w-1/3 relative">
            <label class="text-orange-500 font-bold mb-2">Escolha a Região</label>
            <button id="accordion-regiao-btn" class="bg-gray-200 text-black px-4 py-2 font-bold rounded flex justify-between items-center cursor-pointer focus:outline-none focus:ring-2 focus:ring-orange-500 shadow-sm">
                <span id="accordion-regiao-text">Todas as Regiões</span>
                <span id="accordion-regiao-icon" class="transition-transform duration-300">🔽</span>
            </button>
            <div id="accordion-regiao-list" class="absolute top-full left-0 right-0 mt-1 bg-white border border-gray-200 rounded-lg shadow-xl max-h-60 overflow-y-auto hidden z-50 divide-y divide-gray-100">
                <!-- Preenchido via JS -->
            </div>
        </div>

        <!-- 2. Accordion de UF (Estado) -->
        <div class="flex flex-col w-full md:w-1/3 relative">
            <label class="text-orange-500 font-bold mb-2">Escolha o Estado (UF)</label>
            <button id="accordion-uf-btn" class="bg-gray-200 text-black px-4 py-2 font-bold rounded flex justify-between items-center cursor-pointer focus:outline-none focus:ring-2 focus:ring-orange-500 shadow-sm opacity-60" disabled>
                <span id="accordion-uf-text">Selecione uma Região primeiro</span>
                <span id="accordion-uf-icon" class="transition-transform duration-300">🔽</span>
            </button>
            <div id="accordion-uf-list" class="absolute top-full left-0 right-0 mt-1 bg-white border border-gray-200 rounded-lg shadow-xl max-h-60 overflow-y-auto hidden z-50 divide-y divide-gray-100">
                <!-- Preenchido via JS -->
            </div>
        </div>

        <!-- 3. Barra de Busca de Município -->
        <div class="flex flex-col w-full md:w-1/3">
            <label for="input-busca" class="text-orange-500 font-bold mb-2">Filtrar Município</label>
            <input type="text" id="input-busca" class="bg-gray-50 border border-gray-300 text-black px-4 py-2 rounded focus:outline-none focus:ring-2 focus:ring-orange-500" placeholder="Digite o nome..." disabled>
        </div>

    </section>

    <!-- KPIs Dinâmicos -->
    <section class="flex flex-col md:flex-row gap-8 mb-8 w-full max-w-4xl justify-center">
        <div class="bg-gray-200 text-black font-bold text-xl rounded-lg flex items-center justify-center w-full md:w-[350px] h-[80px] shadow-sm">
            <span id="kpi-id-uf">ID da UF: -</span>
        </div>
        <div class="bg-gray-200 text-black font-bold text-xl rounded-lg flex items-center justify-center w-full md:w-[350px] h-[80px] shadow-sm">
            <span id="kpi-total">Total de cidades encontradas: 0</span>
        </div>
    </section>

    <!-- Gráfico de Cidades por Mesorregião -->
    <section id="container-grafico" class="w-full max-w-4xl mb-8 hidden">
        <div class="bg-white border border-gray-200 p-4 rounded-lg shadow-sm">
            <h2 class="text-center text-orange-500 font-bold mb-4">Quantidade de Cidades por Mesorregião</h2>
            <div class="relative h-64 w-full">
                <canvas id="graficoMesorregioes"></canvas>
            </div>
        </div>
    </section>

    <!-- Tabela de Municípios -->
    <main class="w-full max-w-4xl border-2 border-orange-500 min-h-[500px] overflow-y-auto p-4 mb-10">
        <div id="tabela-municipios" class="grid grid-cols-1 md:grid-cols-3 divide-y md:divide-y-0 md:divide-x-2 divide-orange-200 text-center">
            <!-- Os municípios serão injetados dinamicamente via script.js -->
        </div>
    </main>

</body>
</html>
